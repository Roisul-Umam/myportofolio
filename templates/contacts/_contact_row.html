<tr id="contact-{{ contact.id }}">
    <td>{{ contact.name }}</td>
    <td>{{ contact.email }}</td>
    <td>
        <button class="button button-secondary button-small"
                hx-get="{% url 'contacts:contact_edit' contact.id %}"
                hx-target="closest tr"
                hx-swap="outerHTML">
            Edit
        </button>
        <button class="button button-danger button-small"
                hx-delete="{% url 'contacts:contact_delete' contact.id %}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete {{ contact.name }}?">
            Delete
        </button>
    </td>
</tr>
